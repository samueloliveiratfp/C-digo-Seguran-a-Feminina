<style>
  :root {
    --bg1: #F8D9DF;
    --bg2: #FDF2F3;
    --bg3: #FBE8DA;
    --wine: #7A1B33;
    --wine-dark: #4E1826;
    --rose: #D24B62;
    --rose-soft: #F9E1E6;
    --text: #5E4850;
    --ink: #3F2530;
    --muted: #8A7178;
    --card: #FFFCFA;
    --line: #F1CDD5;
    --gold: #E9B56A;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.6;
    padding: 20px 20px 40px;
    overflow-x: hidden;
  }

  .wrap { max-width: 480px; margin: 0 auto; }

  .topbar { min-height: 40px; }
  .back {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px;
    padding: 8px 0; cursor: pointer;
  }

  .progress-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 8px 0 10px;
  }
  .progress { height: 8px; background: var(--rose-soft); border-radius: 999px; overflow: hidden; margin: 0 0 28px; }
  .progress-fill {
    height: 100%; width: 0%; background: var(--rose); border-radius: 999px;
    transition: width .35s ease;
  }

  .screen, .welcome { animation: rise .4s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen, .welcome { animation: none; } }

  h1, h2 {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    color: var(--wine);
    line-height: 1.22; text-wrap: balance; margin: 0 0 16px; font-weight: 700;
  }
  h1 { font-size: 34px; }
  h2 { font-size: 26px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); font-size: 16px; }
  .center { text-align: center; }
  .kicker {
    text-transform: uppercase; letter-spacing: .1em; font-size: 13px; font-weight: 700;
    color: var(--rose); margin: 0 0 12px;
  }

  .welcome { margin-top: 40px; text-align: center; }
  .welcome h1 { font-size: 36px; margin-bottom: 20px; }
  .welcome .lead { font-size: 18px; color: var(--muted); margin-bottom: 8px; }

  .btn {
    display: block; width: 100%; min-height: 58px; text-align: center; text-decoration: none;
    background: var(--rose); color: #FFFFFF;
    border: 0; border-radius: 999px; padding: 16px 20px;
    font: inherit; font-weight: 800; font-size: 18px; cursor: pointer;
    margin-top: 24px; box-shadow: 0 10px 22px rgba(210, 75, 98, .28);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn:active { transform: translateY(1px); }

  .choices { display: grid; gap: 12px; margin-top: 4px; }
  .choice {
    width: 100%; min-height: 56px; text-align: left; font: inherit; font-size: 17px; font-weight: 600;
    color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 16px 18px; cursor: pointer; overflow-wrap: anywhere;
  }
  .choice:hover { border-color: var(--rose); background: var(--rose-soft); }

  .yesno { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
  .yesno .choice { text-align: center; min-height: 64px; font-size: 18px; }
  .yesno .choice.yes { background: var(--rose); color: #FFFFFF; border-color: var(--rose); }

  .scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 8px; }
  .scale .choice { text-align: center; padding: 12px 0; font-size: 18px; font-variant-numeric: tabular-nums; }

  input[type="text"] {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink);
    background: var(--card); border: 2px solid var(--rose); border-radius: 16px;
    padding: 16px 18px; margin-top: 12px; min-height: 56px;
  }
  input[type="text"]:focus { outline: none; box-shadow: 0 0 0 4px var(--rose-soft); }

  /* Cards */
  .card {
    background: var(--card); border-radius: 20px; padding: 22px 20px; margin: 16px 0;
    border: 1px solid var(--line);
  }
  .card .label {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
    color: var(--rose); margin-bottom: 10px;
  }
  .card h2 { font-size: 23px; margin-bottom: 10px; }
  .card p:last-child { margin-bottom: 0; }

  .dark {
    background: var(--wine-dark); color: #FBEFF1; border: 0; border-radius: 22px;
    padding: 26px 22px; margin: 16px 0;
  }
  .dark h2 { color: #FBEFF1; font-style: italic; font-size: 24px; }
  .dark .note { color: #E8CFD5; font-size: 15px; margin: 14px 0 0; }

  /* Gauge */
  .gauge { text-align: center; }
  .gauge svg { width: 100%; max-width: 260px; display: block; margin: 0 auto; }
  .g-track { fill: none; stroke: rgba(255, 255, 255, .14); stroke-width: 14; stroke-linecap: round; }
  .g-fill { fill: none; stroke: var(--gold); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 251.3; }
  .g-val {
    font-family: "Playfair Display", Georgia, serif; font-size: 40px; font-weight: 700;
    color: #FBEFF1; margin-top: 4px; line-height: 1.1;
  }
  .g-cap { font-size: 14px; color: #E8CFD5; }

  /* Bars */
  .bar { margin-bottom: 14px; }
  .bar:last-child { margin-bottom: 0; }
  .bar-top { display: flex; justify-content: space-between; font-size: 15px; color: var(--ink); margin-bottom: 6px; }
  .track { height: 10px; background: var(--rose-soft); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width 1s ease; }

  /* Ticks (check symbol) */
  .tick {
    width: 26px; height: 26px; min-width: 26px; border-radius: 50%;
    background: var(--rose); display: inline-flex; align-items: center; justify-content: center;
  }
  .tick svg { width: 14px; height: 14px; fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .tick.gold { background: var(--gold); }
  .tick.gold svg { stroke: var(--wine-dark); }

  /* Checklist */
  .checks { list-style: none; padding: 0; margin: 14px 0 0; }
  .checks li {
    display: flex; gap: 14px; align-items: flex-start; font-size: 16px; line-height: 1.5;
    margin-bottom: 14px; color: #FBEFF1;
  }
  .checks li:last-child { margin-bottom: 0; }
  .checks li .tick { margin-top: 1px; }

  /* Analysis screen */
  .an-title { text-align: center; font-size: 26px; margin-top: 24px; }
  .an-list { margin: 28px 0 0; }
  .an-item {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 12px; color: var(--ink); font-weight: 600;
    opacity: .45; transition: opacity .3s ease;
  }
  .an-item.done { opacity: 1; }
  .an-item .num {
    width: 26px; height: 26px; min-width: 26px; border-radius: 50%;
    background: var(--rose-soft); color: var(--rose); font-size: 13px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* Mind section */
  .mind-item {
    background: var(--rose-soft); border-radius: 18px; padding: 18px 18px 18px 20px; margin-bottom: 12px;
    display: grid; grid-template-columns: 44px 1fr; gap: 6px 10px;
  }
  .mind-item .n {
    font-family: "Playfair Display", Georgia, serif; font-size: 24px; font-weight: 700; color: var(--rose); line-height: 1.2;
  }
  .mind-item h3 { margin: 0 0 4px; font-size: 17px; font-weight: 800; color: var(--wine); }
  .mind-item p { margin: 0; font-size: 15.5px; color: var(--text); }

  /* Price */
  .price { text-align: center; margin: 22px 0 6px; }
  .price .old { font-size: 16px; color: var(--muted); margin: 0 0 4px; }
  .price .old s { text-decoration: line-through; }
  .price .now {
    font-family: "Playfair Display", Georgia, serif; font-size: 52px; font-weight: 700;
    color: var(--wine); margin: 0; line-height: 1.1;
  }
  .price .small { font-size: 15px; color: var(--muted); margin: 6px 0 0; }

  .cta-note { text-align: center; font-size: 15px; color: var(--muted); margin: 14px 0 0; }

  @media (max-width: 360px) {
    body { padding: 16px 16px 32px; }
    h1 { font-size: 30px; }
    .welcome h1 { font-size: 32px; }
    h2 { font-size: 23px; }
    .yesno { grid-template-columns: 1fr; }
    .scale { grid-template-columns: repeat(4, 1fr); }
  }
</style>

    const el = document.createElement(tag);
    for (const k in props) {
      if (k === "class") el.className = props[k];
      else if (k === "on") for (const ev in props.on) el.addEventListener(ev, props.on[ev]);
      else if (k === "hidden") el.hidden = props[k];
      else el.setAttribute(k, props[k]);
    }
    const add = (kid) => {
      if (kid == null || kid === false) return;
      if (Array.isArray(kid)) { kid.forEach(add); return; }
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    };
    kids.forEach(add);
    return el;
  }

  function tick(gold = false) {
    const s = document.createElement("span");
    s.className = gold ? "tick gold" : "tick";
    s.setAttribute("aria-hidden", "true");
    s.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
    return s;
  }

  function bar(label, pct, color) {
    return h("div", { class: "bar" },
      h("div", { class: "bar-top" }, h("span", {}, label), h("span", {}, `${pct}%`)),
      h("div", { class: "track" }, h("div", { class: "fill", style: `width:${pct}%;background:${color}` })));
  }

  function gauge(score) {
    const offset = 251.3 * (1 - score / 10);
    const g = document.createElement("div");
    g.className = "gauge";
    g.innerHTML =
      `<svg viewBox="0 0 200 110" aria-hidden="true">` +
      `<path class="g-track" d="M20 100 A80 80 0 0 1 180 100"/>` +
      `<path class="g-fill" d="M20 100 A80 80 0 0 1 180 100" style="stroke-dashoffset:${offset}"/>` +
      `</svg>` +
      `<div class="g-val">${score}/10</div>` +
      `<div class="g-cap">Índice de segurança emocional</div>`;
    return g;
  }

  function go(next) {
    history.push(idx);
    idx = next;
    render();
  }

  function back() {
    if (history.length) { idx = history.pop(); render(); }
  }

  function answerChoice(step, value) {
    state.answers[step.key] = value;
    if (step.key === "medo") {
      steps = steps.filter((s) => s.type !== "sim");
      state.simAns = {};
      const pos = steps.indexOf(step);
      const sims = FEARS[value].sims.map((q, i) => ({ type: "sim", n: i + 1, text: q, fear: value }));
      steps.splice(pos + 1, 0, ...sims);
    }
    go(idx + 1);
  }

  function analysisScreen() {
    const token = renderToken;
    const items = ANALYSIS_STEPS.map((t, i) =>
      h("div", { class: "an-item" }, h("span", { class: "num" }, String(i + 1)), h("span", {}, t)));
    const fill = h("div", { class: "progress-fill" });
    fill.style.width = "0%";
    const bar = h("div", { class: "progress" }, fill);
    let k = 0;
    const step = () => {
      if (token !== renderToken) return;
      if (k < items.length) {
        const item = items[k];
        item.classList.add("done");
        item.querySelector(".num").replaceWith(tick());
        k++;
        fill.style.width = Math.round((k / items.length) * 100) + "%";
        setTimeout(step, 900);
      } else {
        setTimeout(() => { if (token === renderToken) go(idx + 1); }, 600);
      }
    };
    setTimeout(step, 600);
    return h("section", { class: "screen" },
      h("h2", { class: "an-title" }, `Analisando as respostas de ${state.nome}`),
      h("div", { class: "an-list" }, items),
      bar);
  }

  function resultScreen() {
    const a = state.answers;
    const fear = FEARS[a.medo];
    const yes = Object.values(state.simAns).filter(Boolean).length;
    const score = Number(a.seguranca);
    const faixa = score <= 3 ? "baixa" : score <= 6 ? "em alerta" : score <= 8 ? "razoável" : "alta";
    const scoreText = score <= 3
      ? "Hoje a sua sensação de segurança está baixa. Isso pesa no seu dia a dia e no jeito como você se sente com ele."
      : score <= 6
      ? "Você está no meio do caminho. Há momentos de paz, mas o medo aparece com frequência."
      : score <= 8
      ? "Você se sente razoavelmente segura. Ainda existem pontos que mexem com você, e vale olhar para eles."
      : "Você se sente bem segura hoje. Mesmo assim, vale entender o que pode abalar essa paz.";
    const strong = yes >= 2;
    const alertPct = Math.round((yes / 4) * 100);
    const freedom = { "quase-nunca": 90, "as-vezes": 60, "frequente": 35, "quase-sempre": 15 }[a.evita];
    const rest = { "nunca": 90, "algumas": 55, "muitas": 20 }[a.dormir];
    const simText = yes >= 3
      ? `Você respondeu sim a ${yes} de 4 sinais ligados a esse medo. Ele está bem presente na sua rotina.`
      : yes >= 1
      ? `Você respondeu sim a ${yes} de 4 sinais ligados a esse medo. Ele aparece em alguns momentos.`
      : "Você não se reconheceu nos sinais desse medo, mas ele ainda pode estar pesando de forma silenciosa.";

    const mind = [
      ["01", "Deixar de buscar validação externa",
        "Parar de perguntar \"será que ele gosta de mim?\" e começar a se perguntar \"eu gosto de como me sinto ao lado dele?\"."],
      ["02", "Dizer não com clareza",
        "Aprender a dizer não e a se retirar de situações desconfortáveis é uma prioridade para a sua segurança emocional."],
      ["03", "Autoacolhimento",
        "Aceitar as suas falhas e a sua história, entendendo que segurança não significa ser perfeita, mas ser aliada de si mesma."]
    ];

    return h("section", { class: "screen" },
      h("p", { class: "kicker" }, `Diagnóstico de ${state.nome}`),
      h("h1", { style: "font-size:32px" }, `Sua segurança emocional está ${faixa}`),
      h("div", { class: "dark" },
        gauge(score),
        h("p", { class: "note", style: "text-align:center;margin-top:14px" }, scoreText)),
      h("div", { class: "card" },
        h("div", { class: "label" }, "Mapa da sua relação hoje"),
        bar("Segurança emocional", score * 10, "var(--gold)"),
        bar("Sinais de alerta", alertPct, "var(--rose)"),
        bar("Liberdade para falar", freedom, "var(--gold)"),
        bar("Paz para descansar", rest, "var(--gold)")),
      h("div", { class: "card" },
        h("div", { class: "label" }, "Como está a relação"),
        h("p", {}, `Vocês estão juntos há ${TEMPO_TEXT[a.tempo]}. ${RELACAO_TEXT[a.relacao]}`),
        h("p", {}, EVITA_TEXT[a.evita])),
      h("div", { class: "card" },
        h("div", { class: "label" }, "Seu ponto de atenção"),
        h("h2", {}, fear.label),
        h("p", {}, strong ? fear.strong : fear.soft),
        h("p", { class: "muted" }, simText)),
      h("div", { class: "card" },
        h("div", { class: "label" }, "O que está travando"),
        h("p", {}, CONV_TEXT[a.conversou]),
        h("p", {}, DORMIR_TEXT[a.dormir]),
        h("p", {}, FUTURO_TEXT[a.futuro]),
        h("p", { class: "muted" }, `Agora, o que você mais quer é ${QUER_TEXT[a.quer]}.`)),
      h("div", { class: "card" },
        h("div", { class: "label" }, "O caminho para você"),
        h("h2", {}, "O que você vai resolver"),
        h("p", {}, fear.solve)),
      h("section", { style: "margin-top:28px" },
        h("h2", { style: "font-size:24px" }, "O que você leva do Código"),
        h("p", { class: "muted" }, "Um caminho prático para entender o que sente e agir com mais clareza, no seu tempo."),
        [
          ["Você separa fato de interpretação", "Aprende a checar se a desconfiança tem base antes de agir sobre ela, usando a técnica dos três passos."],
          ["Você aprende a pedir sem se apagar", "Recebe frases prontas para dizer o que sente sem acusar e sem deixar de ser você."],
          ["Você ganha um plano de 21 dias", "Uma tarefa curta por dia, de 10 a 20 minutos, com um pilar do Método S.E.G.U.R.A em cada etapa."],
          ["Você acompanha a sua evolução", "No diário de segurança, compara a sua nota do dia 1 com a do dia 21 e vê o que já mudou."]
        ].map(([t, d]) =>
          h("div", { class: "mind-item" },
            tick(),
            h("div", {}, h("h3", {}, t), h("p", {}, d))))),
      h("section", { style: "margin-top:28px" },
        h("h2", { style: "font-size:24px" }, "O que muda por dentro?"),
        h("p", { class: "muted" },
          "Independentemente de terem escolhido continuar na relação ou iniciar uma nova relação, a transição da insegurança para o bem estar envolve uma mudança interna primeiro, onde você vai aprender a:"),
        mind.map(([n, t, d]) =>
          h("div", { class: "mind-item" },
            h("div", { class: "n" }, n),
            h("div", {}, h("h3", {}, t), h("p", {}, d))))),
      h("button", { class: "btn", type: "button", on: { click: () => go(idx + 1) } }, "Ver o meu caminho"));
  }

  function finalScreen() {
    const fear = FEARS[state.answers.medo];
    const encontra = [
      "Os 5 medos mais comuns em relacionamentos e o que está por trás de cada um",
      "Sinais para reconhecer cada medo sem se culpar, com a técnica dos três passos",
      "Exercícios de 10 minutos para acalmar a mente quando o medo aparece",
      "Frases prontas para conversar com ele sem acusar e sem se apagar",
      "O Método S.E.G.U.R.A, com seis pilares e uma ação concreta para cada um",
      "Plano de 21 dias, com tarefas diárias de 10 a 20 minutos",
      "Diário de segurança semanal, com comparação da sua nota no dia 1 e no dia 21",
      "Orientação sobre quando procurar um psicólogo, sem adiar o cuidado com você"
    ];
    return h("section", { class: "screen" },
      h("h1", { style: "font-size:32px" }, `${state.nome}, este é o Código da Segurança Feminina`),
      h("p", { class: "muted" }, "Um material para você parar de viver em alerta e sentir paz no seu relacionamento."),
      h("div", { class: "dark" },
        h("h2", {}, "O que você vai encontrar"),
        h("ul", { class: "checks" }, encontra.map((t) => h("li", {}, tick(true), h("span", {}, t))))),
      h("div", { class: "card" },
        h("div", { class: "label" }, "O que você vai resolver"),
        h("h2", { style: "font-size:22px" }, `${state.nome}, você não precisa passar por isso sozinha.`),
        h("p", {}, fear.solve)),
      h("div", { class: "price" },
        h("p", { class: "old" }, "De ", h("s", {}, "R$ 197,00"), " por"),
        h("p", { class: "now" }, "R$ 37,00"),
        h("p", { class: "small" }, "Preço de lançamento")),
      h("a", { class: "btn", href: checkoutLink(), target: "_blank", rel: "noopener" }, "Quero o meu Código"),
      h("p", { class: "cta-note" }, "Acesso imediato após a compra."));
  }

  function screenFor(step) {
    switch (step.type) {
      case "welcome":
        return h("section", { class: "welcome" },
          h("p", { class: "kicker" }, "Código da Segurança Feminina"),
          h("h1", {}, "Como você se sente no seu relacionamento?"),
          h("p", { class: "lead" },
            "Em poucos minutos, você descobre como está sua segurança emocional, o que está travando seu relacionamento e como ter mais paz, conexão e confiança."),
          h("button", { class: "btn", type: "button", on: { click: () => go(idx + 1) } }, "Iniciar"));

      case "input": {
        const input = h("input", { type: "text", id: "nome-input", placeholder: "Seu primeiro nome", autocomplete: "given-name", maxlength: "40" });
        const btn = h("button", { class: "btn", type: "button", disabled: "" }, "Continuar");
        const sync = () => { btn.disabled = input.value.trim().length === 0; };
        const submit = () => {
          if (input.value.trim()) { state.nome = input.value.trim(); track("ViewContent"); go(idx + 1); }
        };
        input.addEventListener("input", sync);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
        btn.addEventListener("click", submit);
        setTimeout(() => input.focus({ preventScroll: true }), 50);
        return h("section", { class: "screen" },
          h("h2", {}, step.title), h("p", { class: "muted" }, step.text), input, btn);
      }

      case "choice":
        return h("section", { class: "screen" },
          h("h2", {}, step.title),
          h("div", { class: "choices" },
            step.options.map((opt) => h("button", {
              class: "choice", type: "button",
              on: { click: () => answerChoice(step, opt.value) }
            }, opt.label))));

      case "scale": {
        const nums = [];
        for (let i = 0; i <= 10; i++) {
          nums.push(h("button", {
            class: "choice", type: "button", "aria-label": `Nota ${i} de 10`,
            on: { click: () => answerChoice(step, String(i)) }
          }, String(i)));
        }
        return h("section", { class: "screen" },
          h("h2", {}, step.title),
          h("p", { class: "muted" }, "0 é nada segura. 10 é totalmente segura."),
          h("div", { class: "scale" }, nums));
      }

      case "sim": {
        const answer = (yes) => {
          state.simAns[step.n] = yes;
          go(idx + 1);
        };
        return h("section", { class: "screen" },
          h("p", { class: "kicker" }, `Pergunta ${step.n} de 4`),
          h("h2", {}, step.text),
          h("div", { class: "yesno" },
            h("button", { class: "choice yes", type: "button", on: { click: () => answer(true) } }, "Sim"),
            h("button", { class: "choice", type: "button", on: { click: () => answer(false) } }, "Não")));
      }

      case "analysis":
        return analysisScreen();

      case "result":
        return resultScreen();

      case "final":
        return finalScreen();
    }
    return h("div");
  }

  function render() {
    renderToken++;
    const app = $("app");
    app.textContent = "";
    const step = steps[idx];
    if (step.type === "result") track("Lead");
    app.append(screenFor(step));
    $("back").hidden = history.length === 0 || step.type === "welcome" || step.type === "analysis";
    const showBar = !["welcome", "analysis", "result", "final"].includes(step.type);
    $("top").hidden = !showBar;
    $("bar").hidden = !showBar;
    const last = steps.length - 1;
    const pct = Math.round((idx / last) * 100);
    $("fill").style.width = pct + "%";
    $("pct").textContent = pct + "%";
    window.scrollTo(0, 0);
  }

  $("back").addEventListener("click", back);
  render();
</script>
</body>
</html>
