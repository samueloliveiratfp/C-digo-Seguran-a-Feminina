<style>
  /* Paleta: verde (base), creme (fundo), terracota (seleção), laranja (ação), sálvia e pêssego (apoio). */
  :root {
    --bg: #FBF7F2;
    --fg: #2F4F3E;
    --muted: #5C6E63;
    --card: #F6E3D9;
    --sel: #A0522D;
    --accent: #E8833A;
    --sage: #E3EEE7;
    --peach: #F6C9A8;
    --hero-bg: #2F4F3E;
    --hero-fg: #FBF7F2;
    --on-accent: #2F4F3E;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E2A23;
      --fg: #F4EEE6;
      --muted: #C9BFB2;
      --card: #2E3D34;
      --sel: #D98A5E;
      --accent: #E8833A;
      --sage: #26352C;
      --peach: #4A3428;
      --hero-bg: #2F4F3E;
      --hero-fg: #FBF7F2;
      --on-accent: #2F4F3E;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E2A23;
    --fg: #F4EEE6;
    --muted: #C9BFB2;
    --card: #2E3D34;
    --sel: #D98A5E;
    --accent: #E8833A;
    --sage: #26352C;
    --peach: #4A3428;
    --hero-bg: #2F4F3E;
    --hero-fg: #FBF7F2;
    --on-accent: #2F4F3E;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.6;
    padding: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
    overflow-x: hidden;
  }

  .wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    min-width: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 40px;
  }
  .back {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px;
    padding: 8px 0; cursor: pointer;
  }

  .progress {
    height: 8px;
    background: var(--peach);
    border-radius: 999px;
    overflow: hidden;
    margin: 8px 0 28px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width .35s ease;
  }

  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .screen, .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: rise .4s ease both;
  }
  .welcome { justify-content: center; padding-bottom: 24px; }
  .screen { justify-content: flex-start; padding-top: 8px; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .screen, .welcome, .progress-fill { animation: none; transition: none; }
  }

  h1, h2 {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    line-height: 1.22;
    text-wrap: balance;
    margin: 0 0 16px;
  }
  h1 { font-size: 36px; }
  h2 { font-size: 26px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); font-size: 16px; }
  .kicker {
    text-transform: uppercase; letter-spacing: .08em; font-size: 13px; font-weight: 700;
    color: var(--sel); margin: 0 0 12px;
  }

  .welcome h1 { font-size: 38px; color: var(--fg); margin-bottom: 22px; }
  .welcome .lead { font-size: 18px; color: var(--muted); margin-bottom: 32px; }

  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 56px; text-align: center; text-decoration: none;
    background: var(--accent); color: var(--on-accent);
    border: 0; border-radius: 16px; padding: 16px 20px;
    font: inherit; font-weight: 800; font-size: 18px; cursor: pointer;
    margin-top: 24px;
    box-shadow: 0 8px 20px rgba(232, 131, 58, .28);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn:active { transform: translateY(1px); }

  .choices { display: grid; gap: 12px; margin-top: 4px; }
  .choice {
    width: 100%; min-height: 56px; text-align: left; font: inherit; font-size: 17px; font-weight: 600;
    color: var(--fg);
    background: var(--card); border: 2px solid transparent; border-radius: 16px;
    padding: 16px 18px; cursor: pointer; min-width: 0; overflow-wrap: anywhere;
  }
  .choice:hover { border-color: var(--peach); }
  .choice[aria-pressed="true"] { border-color: var(--sel); }

  .yesno { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
  .yesno .choice { text-align: center; min-height: 64px; font-size: 18px; }
  .yesno .choice.yes { background: var(--accent); color: var(--on-accent); }

  .scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 8px; }
  .scale .choice {
    width: 100%; min-height: 52px; text-align: center; padding: 12px 0;
    font-variant-numeric: tabular-nums; font-size: 18px;
  }

  input[type="text"] {
    width: 100%; font: inherit; font-size: 17px; color: var(--fg);
    background: var(--bg); border: 2px solid var(--peach); border-radius: 14px;
    padding: 16px 18px; margin-top: 12px; min-height: 56px;
  }
  input[type="text"]:focus { border-color: var(--sel); outline: none; }

  .card {
    background: var(--sage); border-radius: 18px; padding: 22px 20px; margin: 16px 0;
    border-left: 5px solid var(--sel);
  }
  .card .label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--sel); margin-bottom: 8px; }
  .card h2 { font-size: 23px; margin-bottom: 10px; }

  ul.list { padding-left: 0; list-style: none; margin: 8px 0 20px; }
  ul.list li {
    position: relative; padding-left: 28px; margin-bottom: 14px; min-width: 0; overflow-wrap: anywhere;
  }
  ul.list li::before {
    content: ""; position: absolute; left: 0; top: .55em; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent);
  }

  .solve {
    background: var(--peach); color: #2F1F17;
    border-radius: 16px; padding: 18px 20px; margin: 16px 0;
  }
  :root[data-theme="dark"] .solve { color: var(--fg); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .solve { color: var(--fg); } }

  .offer {
    text-align: center; background: var(--sage); border-radius: 18px; padding: 22px 20px;
    margin: 16px 0; border: 2px solid var(--accent);
  }
  .offer-label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--sel); margin: 0 0 8px; }
  .offer-old { font-size: 16px; color: var(--muted); text-decoration: line-through; margin: 0 0 6px; }
  .offer-now { font-size: 28px; font-weight: 800; color: var(--fg); margin: 0; font-variant-numeric: tabular-nums; }

  .cta-note { text-align: center; font-size: 15px; color: var(--muted); margin: 14px 0 0; }

  @media (max-width: 360px) {
    body { padding-left: 16px; padding-right: 16px; }
    h1 { font-size: 30px; }
    .welcome h1 { font-size: 32px; }
    h2 { font-size: 23px; }
    .yesno { grid-template-columns: 1fr; }
    .scale { grid-template-columns: repeat(4, 1fr); }
  }
</style>
